<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bot Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-dark">

  <!-- Header & Settings Navigation -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">👨🏿‍🦱</span>
      <span class="logo-text">Idk Man Im Tired</span>
    </div>

    <div class="settings-container">
      <button id="settingsBtn" class="settings-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
        <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <!-- Settings Dropdown Menu -->
      <div id="settingsDropdown" class="settings-dropdown hidden">
        <div class="tabs-header">
          <div class="tabs">
            <button class="tab-btn active" data-tab="websiteTab">Website</button>
            <button class="tab-btn" data-tab="discordTab">Discord</button>
          </div>
        </div>

        <div class="tab-body">
          <!-- WEBSITE TAB -->
          <div id="websiteTab" class="tab-content active">
            <div class="input-group">
              <label for="themeSelect">Website Theme</label>
              <div class="custom-select-wrapper">
                <select id="themeSelect">
                  <option value="theme-dark">Dark Minimal</option>
                  <option value="theme-midnight">Midnight Purple</option>
                  <option value="theme-cyber">Cyber Neon</option>
                </select>
              </div>
            </div>
          </div>

          <!-- DISCORD TAB -->
          <div id="discordTab" class="tab-content">
            <div class="input-group">
              <label for="botToken">Discord Bot Token</label>
              <div class="lock-wrapper">
                <input type="password" id="botToken" class="font-mono" placeholder="MTI0..." disabled />
                <button id="lockToggleBtn" class="lock-btn locked" title="Unlock to Edit">
                  <svg class="lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                </button>
              </div>
            </div>

            <div class="input-group">
              <label for="guildId">Target Guild ID (GUID)</label>
              <input type="text" id="guildId" class="font-mono" placeholder="102938475610293847" />
            </div>

            <div class="divider"></div>

            <div class="input-group">
              <div class="label-row">
                <label for="botName">Discord Bot Name</label>
                <span id="errorTag" class="error-tag hidden">( ERROR )</span>
              </div>
              <input type="text" id="botName" placeholder="Type bot name & press Enter" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Dashboard -->
  <main class="dashboard">
    <div class="dashboard-header">
      <h2>Connected Bots</h2>
      <span class="badge-count" id="botCount">0 Active</span>
    </div>

    <div id="botCardsContainer" class="bot-grid">
      <!-- Dynamic Bot Cards render here -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
